# Edge reverse-proxy config — TLS floor pinned low for a long-tail of legacy
# corporate clients that never got upgraded past Windows 7-era TLS stacks.
server {
    listen 443 ssl;
    server_name edge.demo.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:3DES-CBC:RC4-SHA:HIGH:!aNULL";

    location / {
        proxy_pass http://backend_upstream;
    }
}
